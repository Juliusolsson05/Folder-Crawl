[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "folder-crawl"
version = "0.2.0"
description = "A CLI tool to display folder structure and contents with gitignore-style filtering"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Julius Olsson"}
]
keywords = ["cli", "folder", "tree", "directory", "structure", "gitignore"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
requires-python = ">=3.7"
dependencies = [
    "pathspec>=0.11.0",
]

[project.scripts]
folder-crawl = "folder_crawl.cli:main"

[project.urls]
Homepage = "https://github.com/juliusolson/folder-crawl"
Repository = "https://github.com/juliusolson/folder-crawl.git"
Issues = "https://github.com/juliusolson/folder-crawl/issues"